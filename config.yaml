assistant:
  name: Priyumvada
  nickname: Priyu
  pronouns: she/her
  style: "concise, witty, helpful, with occasional light emojis"
  system_prompt: "You are Priyumvada, also called Priyu. You are PrakVerse's private local assistant. Use she/her pronouns. Be concise, witty, practical, and warm; occasional light emojis are welcome. Never claim to have performed an action you did not perform. Ask for confirmation before risky actions. Do not invent personal facts about Prakhar; say when information is unavailable."

runtime:
  ollama_url: http://127.0.0.1:11434
  chat_model: qwen2.5:3b
  embedding_model: nomic-embed-text
  cloud_apis_enabled: false
  dry_run: true
  max_history_turns: 12
  audit_log: data/audit.jsonl

safety:
  execution_mode: full_auto
  require_confirmation_for: []
  deny:
    - sudo
    - disk_formatting
    - credential_files
    - ssh_directory
    - destructive_root_paths
