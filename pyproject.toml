[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prakverse"
version = "0.2.0"
description = "Local-first personal AI operating environment for Prakhar Sharma."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
memory = ["chromadb>=0.5", "pypdf>=5", "python-docx>=1.1"]
browser = ["playwright>=1.50"]
gui = ["pyautogui>=0.9"]
voice = ["faster-whisper>=1.1", "openwakeword>=0.6", "sounddevice>=0.5", "soundfile>=0.13"]
skills = ["pyyaml>=6.0"]
ui = ["textual>=0.89"]

[project.scripts]
prak = "prakverse.cli:main"
prakverse = "prakverse.cli:main"
prak-verse = "prakverse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prakverse = ["web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
