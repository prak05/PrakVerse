[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prakverse"
version = "0.1.0"
description = "Local-first personal AI operating environment for Prakhar Sharma."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
memory = ["chromadb>=0.5", "pypdf>=5", "python-docx>=1.1"]
browser = ["playwright>=1.50"]
gui = ["pyautogui>=0.9"]

[project.scripts]
prak = "prakverse.cli:main"
prakverse = "prakverse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
